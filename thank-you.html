<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're on the List! — Macbase Elegant</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            text-align: center;
            padding: 20px;
        }
        .thank-you-container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-out;
        }
        .check-icon {
            font-size: 64px;
            margin-bottom: 24px;
            display: block;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .discount-badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(186, 255, 41, 0.1);
            border: 1px solid var(--text-neon);
            color: var(--text-neon);
            border-radius: 100px;
            font-weight: 600;
            margin-bottom: 24px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <span class="check-icon">✨</span>
        <div class="discount-badge">50% DISCOUNT RESERVED</div>
        <h1>You're on the Elegant Waitlist</h1>
        <p>Thank you for your interest in the signed, hassle-free version of Macbase. We've recorded your preference and will notify you the moment the Apple-certified installer is ready.</p>
        <a href="index.html" class="btn-primary" style="display: inline-flex; align-items: center;">
            Back to Home
        </a>
    </div>
</body>
</html>
